name: Run Tagged Suite
on:
  workflow_dispatch:    
    inputs:
      tag:        
        description: 'Cucumber tag to execute'        
        default: '@Smoke'        
        required: true

concurrency:
  group: manual-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa
    permissions:
      contents: read
    env:
      AENEWEMAIL: ${{ secrets.AENEWEMAIL }}
      AEEMAIL: ${{ secrets.AEEMAIL }}
      AEPASSWORD: ${{ secrets.AEPASSWORD }}
      AEMOBILENUMBER: ${{ secrets.AEMOBILENUMBER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show runtime versions
        run: |
          java -version
          mvn -version
          chrome --version

      - name: Execute selected tag
        run: mvn -B clean test -Plocal,chromeHeadless,sequential -Dcucumber.tags=${{ github.event.inputs.tag }}

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-tagged-${{ github.run_number }}
          path: |
            target/reports/
            target/surefire-reports/
          if-no-files-found: warn
