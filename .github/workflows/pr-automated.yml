name: PR Automated Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-automated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automated-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run @Automated suite
        env:
          CUSTOM_COMMAND: mvn clean test -Plocal,chromeHeadless,sequential -Dcucumber.tags=@Automated
        run: docker compose -f local-docker-compose.yml up --abort-on-container-exit --exit-code-from lippia

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-pr-${{ github.event.pull_request.number }}
          path: |
            target/reports/
            target/surefire-reports/
          if-no-files-found: warn

      - name: Tear down containers
        if: ${{ always() }}
        run: docker compose -f local-docker-compose.yml down --volumes --remove-orphans
